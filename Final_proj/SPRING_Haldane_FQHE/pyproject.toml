[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fqh-spring"
version = "1.0.0"
description = "Born-sampled SPRING optimization of LLL occupation wavefunctions"
requires-python = ">=3.12"
dependencies = [
  "jax==0.9.1",
  "numpy==2.5.4",
  "scipy==1.18.1",
  "optax==0.2.8",
]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[project.scripts]
fqh-train = "fqh_spring.train:main"
fqh-evaluate = "fqh_spring.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
